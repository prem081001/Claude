<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(fonts/HindVadodara-Regular.ttf);font-weight:400}
@font-face{font-family:G;src:url(fonts/HindVadodara-Bold.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:G,sans-serif;position:relative;background:#0b1030}
svg{position:absolute;left:0;top:0}
.t{position:absolute;width:100%;text-align:center}
.a{top:560px;font-size:112px;font-weight:700;color:#ffd35c;line-height:1.2;text-shadow:0 0 30px rgba(255,190,60,.7)}
.b{top:850px;font-size:80px;font-weight:700;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.5)}
.c{top:990px;font-size:44px;line-height:1.6;color:#e8ecff}
.sign{position:absolute;left:190px;width:700px;top:1385px;height:120px;background:#8a1c1c;border:6px solid #ffd35c;border-radius:14px;color:#ffe9a8;font-size:58px;font-weight:700;text-align:center;line-height:108px;box-shadow:0 0 30px rgba(255,211,92,.55)}
</style></head><body>
<svg width="1080" height="1920" viewBox="0 0 1080 1920" id="s"></svg>
<div class="t a">નૂતન<br>વર્ષાભિનંદન</div>
<div class="t b">સાલ મુબારક</div>
<div class="t c">આપને અને આપના પરિવારને<br>સુખ, સ્વાસ્થ્ય અને સમૃદ્ધિથી ભરેલું<br>નવું વર્ષ મુબારક!</div>
<div class="sign">શ્રી ઉમિયા કિરાણા સ્ટોર</div>
<script>
const NS='http://www.w3.org/2000/svg',s=document.getElementById('s');
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||s).appendChild(e);return e}
const d=el('defs',{});const g=el('linearGradient',{id:'sky',x1:0,y1:0,x2:0,y2:1},d);
el('stop',{offset:0,'stop-color':'#070a24'},g);el('stop',{offset:.7,'stop-color':'#1d1555'},g);el('stop',{offset:1,'stop-color':'#4a1d6e'},g);
el('rect',{width:1080,height:1920,fill:'url(#sky)'});
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<90;i++)el('circle',{cx:rnd()*1080,cy:rnd()*1300,r:1+rnd()*2.5,fill:'#fff',opacity:.3+rnd()*.7});
// fireworks
function fw(cx,cy,R,c1,c2){for(let k=0;k<28;k++){const a=k*(360/28)*Math.PI/180;
 const x1=cx+Math.cos(a)*R*.25,y1=cy+Math.sin(a)*R*.25,x2=cx+Math.cos(a)*R,y2=cy+Math.sin(a)*R;
 el('line',{x1,y1,x2,y2,stroke:k%2?c1:c2,'stroke-width':5,'stroke-linecap':'round',opacity:.9});
 el('circle',{cx:cx+Math.cos(a)*R*1.15,cy:cy+Math.sin(a)*R*1.15,r:6,fill:k%2?c1:c2});
 el('circle',{cx:cx+Math.cos(a)*R*.62,cy:cy+Math.sin(a)*R*.62,r:4,fill:'#fff',opacity:.8});}
 el('circle',{cx,cy,r:R*.12,fill:c2})}
fw(190,230,150,'#ff4f8b','#ffd35c');fw(870,170,120,'#44e0b0','#ffd35c');fw(560,330,90,'#8fd3ff','#ff9d1a');
fw(950,470,70,'#ff4f8b','#fff');fw(110,470,60,'#44e0b0','#fff');
// shop
const y0=1500;
el('rect',{x:120,y:y0,width:840,height:420,fill:'#f5e1b8'});
el('rect',{x:120,y:y0,width:840,height:20,fill:'#d9b26a'});
// awning
for(let i=0;i<14;i++){const w=840/14;el('path',{d:`M${120+i*w} ${y0-5} h${w} v70 a${w/2} ${w/2} 0 0 1 ${-w} 0Z`,fill:i%2?'#fff':'#e2531a'});}
el('rect',{x:100,y:y0-25,width:880,height:26,rx:8,fill:'#8a1c1c'});
// shelves with goods
const cols=['#e2531a','#2f8f4e','#ffd35c','#4aa3df','#c8321f','#7a1fa2'];
for(let r=0;r<2;r++){el('rect',{x:150,y:y0+190+r*105,width:780,height:12,fill:'#8a5a2b'});
 for(let i=0;i<13;i++){const h=40+((i*7+r*5)%4)*10;el('rect',{x:165+i*58,y:y0+190+r*105-h,width:42,height:h,rx:6,fill:cols[(i+r*2)%6]});
  el('rect',{x:172+i*58,y:y0+190+r*105-h+10,width:28,height:14,fill:'rgba(255,255,255,.7)'});}}
el('rect',{x:150,y:y0+330,width:780,height:90,fill:'#8a5a2b'});
// string lights
el('path',{d:'M0 60 Q540 200 1080 60',stroke:'#ffd35c','stroke-width':3,fill:'none',opacity:0});
for(let i=0;i<12;i++){const x=60+i*85,y=y0-28+ (i%2?0:0);
 el('circle',{cx:120+i*(840/11),cy:y0+88,r:0,fill:'#fff'});}
// lamp glow
el('ellipse',{cx:540,cy:y0+300,rx:420,ry:140,fill:'rgba(255,211,92,.12)'});
</script></body></html>
