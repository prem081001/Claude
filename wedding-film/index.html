<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prem &amp; Vasudha — Save The Date</title>
<style>
  /* ==========================================================
     1080x1920 · 15s · 30fps · 450 frames
     Cutout animation: the characters are illustrated PNG layers,
     animated on the same deterministic timeline as before —
     every animation is a CSS @keyframes spanning the full 15s,
     declared paused, with animation-delay: var(--t).
     setFrame(n) sets --t to -(n/30)s. No clock, no rAF timing.
     ========================================================== */
  :root{ --t: 0s; --dur: 15s; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1080px; height:1920px; background:#f6efe3; overflow:hidden; }
  body{ font-family:'Inter Display','Inter',system-ui,ui-sans-serif,'DejaVu Sans',sans-serif;
        -webkit-font-smoothing:antialiased; }
  #stage{ position:absolute; inset:0; width:1080px; height:1920px; }
  svg{ display:block; }
  .an{ animation-duration:var(--dur); animation-fill-mode:both; animation-play-state:paused;
       animation-delay:var(--t); animation-timing-function:linear; animation-iteration-count:1; }

  /* character layers: positioned by their feet, so scaling keeps them planted */
  .ch{ position:absolute; transform-origin:50% 100%; will-change:transform,opacity;
       image-rendering:auto; }

  #copy{ position:absolute; inset:0; z-index:30; }
  .tx{ position:absolute; left:12%; width:76%; text-align:center; white-space:nowrap;
       transform-origin:50% 50%; }
  #t-names{ top:540px;  font-size:82px; font-weight:800; letter-spacing:.05em;  padding-left:.05em;  color:#7c1f2e; }
  #t-date { top:676px;  font-size:60px; font-weight:700; letter-spacing:.13em;  padding-left:.13em;  color:#b4832a; }
  #t-std  { top:786px;  font-size:33px; font-weight:600; letter-spacing:.56em;  padding-left:.56em;  color:#8a5a3c; }

  #grain{ position:absolute; inset:-60px; z-index:60; pointer-events:none;
          background-repeat:repeat; mix-blend-mode:multiply; opacity:.045; }
  #vig{ position:absolute; inset:0; z-index:61; pointer-events:none;
        background:radial-gradient(120% 78% at 50% 46%, rgba(0,0,0,0) 46%, rgba(120,70,30,.10) 78%, rgba(90,48,18,.20) 100%); }
</style>
</head>
<body>
<div id="stage">
  <svg id="root" width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#faf4ea"/><stop offset=".45" stop-color="#f6ead6"/>
        <stop offset=".8" stop-color="#f0dcbe"/><stop offset="1" stop-color="#ead0ac"/>
      </linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e8d2ae"/><stop offset=".4" stop-color="#ddc096"/>
        <stop offset="1" stop-color="#c9a276"/>
      </linearGradient>
      <radialGradient id="glow" cx=".5" cy=".74" r=".58">
        <stop offset="0" stop-color="#ffd79b" stop-opacity=".40"/>
        <stop offset="1" stop-color="#ffd79b" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="goldband" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd98a" stop-opacity="0"/>
        <stop offset=".32" stop-color="#ffe6ad" stop-opacity=".9"/>
        <stop offset=".5" stop-color="#fff6e0" stop-opacity="1"/>
        <stop offset=".68" stop-color="#ffe6ad" stop-opacity=".9"/>
        <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="goldstroke" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#efc266"/><stop offset="1" stop-color="#d79a2e"/>
      </linearGradient>
      <radialGradient id="sparkle" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fffdf5" stop-opacity="1"/>
        <stop offset="1" stop-color="#ffdf96" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1080" height="1920" fill="url(#sky)"/>
    <ellipse cx="540" cy="1400" rx="660" ry="480" fill="url(#glow)"/>
    <g id="bokeh"></g>
    <rect x="0" y="1560" width="1080" height="360" fill="url(#floor)"/>
    <ellipse cx="540" cy="1576" rx="580" ry="76" fill="#fff0d2" opacity=".32"/>
    <g id="scene4bg"></g>
    <g id="petals"></g>
    <g id="confetti"></g>
  </svg>

  <!-- illustrated character layers -->
  <div id="layers"></div>

  <svg id="fx" width="1080" height="1920" viewBox="0 0 1080 1920"
       style="position:absolute;inset:0;z-index:20;pointer-events:none"></svg>

  <div id="copy">
    <div class="tx an" id="t-names">PREM &amp; VASUDHA</div>
    <div class="tx an" id="t-date">24 . 01 . 2027</div>
    <div class="tx an" id="t-std">SAVE THE DATE</div>
  </div>

  <svg id="wipewrap" width="1080" height="1920" viewBox="0 0 1080 1920"
       style="position:absolute;inset:0;z-index:40;pointer-events:none">
    <rect id="wipe" class="an" x="-200" y="0" width="1480" height="2600" fill="url(#goldband)" opacity="0"/>
  </svg>
  <div id="grain"></div>
  <div id="vig"></div>
</div>

<script>
/* ===================== timeline core ===================== */
const FPS=30, DUR=15, TOTAL=FPS*DUR;
document.documentElement.style.setProperty('--dur', DUR+'s');
const EASE='cubic-bezier(.45,.05,.2,1)';
let CSS='';
function kf(name, steps){
  let out='@keyframes '+name+'{';
  steps.forEach(s=>{
    const t=Math.max(0,Math.min(DUR,s[0])), pct=(t/DUR*100).toFixed(4);
    let p=s[1]; if(p.indexOf(':')===-1) p='transform:'+p;
    out+=pct+'%{'+p+';animation-timing-function:'+(s[2]||EASE)+'}';
  });
  CSS+=out+'}'; return name;
}
const clamp=(v,a=0,b=1)=>v<a?a:(v>b?b:v);
const outCubic=t=>1-Math.pow(1-t,3);
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ===================== the illustrated cast ===================== */
/* w/h are the on-screen size; cx is the centre, by the ground line the
   character stands on. Trimmed art, so the bounds are the figure itself. */
const GND=1560;                               /* the ground line they stand on */
const CAST=[
  {id:'ring',  src:'art/t_propose.png',      cx:540, by:GND,  h:820, win:[0.40,5.0],  phase:0.5, bob:3},
  {id:'cheer', src:'art/t_couple_cheer.png', cx:540, by:GND,  h:900, win:[5.0,8.80],  phase:0.9},
  {id:'final', src:'art/t_couple_hands.png', cx:540, by:1700, h:800, win:[8.80,15.0], phase:1.1, bob:4}
];
const ASPECT={ 'ring':1140/1500,'cheer':924/1500,'final':873/1500 };

let html='';
CAST.forEach(c=>{
  const w = c.h*ASPECT[c.id];
  html+=`<img class="ch an an-${c.id}" id="${c.id}" src="${c.src}" style="`+
        `left:${(c.cx-w/2).toFixed(1)}px; top:${(c.by-c.h).toFixed(1)}px; `+
        `width:${w.toFixed(1)}px; height:${c.h}px;">`;
});
document.getElementById('layers').innerHTML=html;

/* per-layer keyframes: fade window + a slow bob and breath so nothing is
   ever completely still, plus optional one-off effects */
function charKF(c){
  const t0=c.win[0], t1=c.win[1], fi=c.fi||0.55, fo=c.fo||0.45;
  const bob=c.bob===undefined?5:c.bob, per=c.per||3.7, ph=c.phase||0;
  const s=[];
  for(let t=0;t<=DUR+0.001;t+=0.25){
    const tt=Math.min(t,DUR);
    let a=0, ent=0;
    if(tt>=t0-fi && tt<=t1+fo){
      if(tt<t0){ ent=1-clamp((tt-(t0-fi))/fi); a=outCubic(clamp((tt-(t0-fi))/fi)); }
      else if(tt>t1){ a=1-outCubic(clamp((tt-t1)/fo)); }
      else a=1;
    }
    let dx=0, dy=ent*30, sc=1;
    dy += Math.sin(2*Math.PI*((tt+ph)/per))*bob;
    sc *= 1 + Math.sin(2*Math.PI*((tt+ph)/(per*1.7)))*0.006;
    /* a hop of joy as she says yes */
    if(c.id==='cheer'){
      if(tt>=5.55 && tt<=6.25){ const k=(tt-5.55)/0.7; dy -= Math.sin(k*Math.PI)*36; }
      if(tt>=6.35 && tt<=6.82){ const k=(tt-6.35)/0.47; dy -= Math.sin(k*Math.PI)*16; }
    }
    /* the proposal pushes in gently through its scene */
    if(c.id==='ring' && tt<=5) sc *= lerp(0.975,1.035,clamp(tt/5));
    /* and the final two-shot settles */
    if(c.id==='final' && tt>=8.8) sc *= lerp(0.985,1.0,clamp((tt-8.8)/1.6));
    s.push([tt,'opacity:'+a.toFixed(3)+';transform:translate('+dx.toFixed(2)+'px,'+dy.toFixed(2)+'px) scale('+sc.toFixed(4)+')','linear']);
  }
  return kf('k-'+c.id, s);
}
CAST.forEach(c=>{ charKF(c); CSS+='.an-'+c.id+'{animation-name:k-'+c.id+'}'; });
</script>

<script>
/* ===================== props, particles, scenery ===================== */
const rnd=mulberry32(20270124);
const T1=5, T2=8.8;

/* ---- scene 1: typing bubble above her, heart off his phone ---- */
document.getElementById('fx').innerHTML = `
  <g id="glint" class="an an-glint">
    <path d="M 0,-54 L 7,-14 L 47,-7 L 7,0 L 0,40 L -7,0 L -47,-7 L -7,-14 Z" fill="url(#sparkle)"/>
  </g>`;

/* the glint sits on the ring he is holding up */
kf('glint',[
  [0,'opacity:0;transform:translate(531px,1140px) rotate(0deg) scale(.4)','linear'],
  [1.45,'opacity:0;transform:translate(531px,1140px) rotate(0deg) scale(.4)','linear'],
  [1.95,'opacity:1;transform:translate(531px,1140px) rotate(150deg) scale(1.15)','linear'],
  [2.65,'opacity:.5;transform:translate(531px,1140px) rotate(290deg) scale(.75)','linear'],
  [3.25,'opacity:1;transform:translate(531px,1140px) rotate(440deg) scale(1.2)','linear'],
  [4.35,'opacity:0;transform:translate(531px,1140px) rotate(580deg) scale(.5)','linear'],
  [15,'opacity:0;transform:translate(531px,1140px) rotate(580deg) scale(.5)']
]);

/* ---- scene 2: one confetti burst, falling with sway ---- */
let conf='';
for(let i=0;i<78;i++){
  const x=40+rnd()*1000, sway=30+rnd()*62, dir=rnd()<.5?-1:1;
  const t0=5.4+rnd()*0.45, dur=2.3+rnd()*1.1;
  const w=15+rnd()*13, h=10+rnd()*9, spin=(180+rnd()*520)*(rnd()<.5?-1:1);
  const col=['#e8a33a','#d24a62','#e07f3a','#c9557f','#5fb6a8','#b4832a'][(rnd()*6)|0];
  const nm='cf'+i, steps=[[0,'opacity:0;transform:translate('+x+'px,-70px) rotate(0deg)','linear'],
                          [t0,'opacity:0;transform:translate('+x+'px,-70px) rotate(0deg)','linear']];
  const N=8;
  for(let k=0;k<=N;k++){
    const p=k/N, y=-70+p*2060, dx=Math.sin(p*Math.PI*2.4)*sway*dir;
    const op=p<0.08?1:(p>0.8?(1-(p-0.8)/0.2):1);
    steps.push([t0+dur*p,'opacity:'+op.toFixed(2)+';transform:translate('+(x+dx).toFixed(1)+'px,'+y.toFixed(0)+'px) rotate('+(spin*p).toFixed(0)+'deg)','linear']);
  }
  steps.push([Math.min(14.9,t0+dur+0.05),'opacity:0','linear'],[15,'opacity:0','linear']);
  kf(nm,steps);
  conf+=`<rect class="an an-${nm}" x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="2" fill="${col}"/>`;
}
document.getElementById('confetti').innerHTML=conf;

/* ---- scene 3: marigold petals expanding from the couple ---- */
let pet='';
for(let i=0;i<46;i++){
  const a=(i/46)*Math.PI*2+rnd()*0.12, R=330+rnd()*210;
  const t0=2.15+(i%6)*0.05+rnd()*0.14, dur=2.0+rnd()*0.7;
  const col=['#ef9b2c','#e0761f','#f2b44c','#d9631c'][(rnd()*4)|0]||'#ef9b2c';
  const rot=(rnd()*360)|0, sp=(rnd()*300-150)|0;
  kf('pt'+i,[
    [0,'opacity:0;transform:translate(540px,1180px) rotate('+rot+'deg) scale(0)','linear'],
    [t0,'opacity:0;transform:translate(540px,1180px) rotate('+rot+'deg) scale(0)','cubic-bezier(.16,.8,.3,1)'],
    [t0+0.3,'opacity:1;transform:translate('+(540+Math.cos(a)*R*0.35).toFixed(0)+'px,'+(1180+Math.sin(a)*R*0.35).toFixed(0)+'px) rotate('+(rot+sp*0.35)+'deg) scale(1.1)','cubic-bezier(.16,.8,.3,1)'],
    [t0+dur,'opacity:0;transform:translate('+(540+Math.cos(a)*R).toFixed(0)+'px,'+(1180+Math.sin(a)*R).toFixed(0)+'px) rotate('+(rot+sp)+'deg) scale(.6)','linear'],
    [15,'opacity:0','linear']
  ]);
  pet+=`<ellipse class="an an-pt${i}" cx="0" cy="0" rx="17" ry="11" fill="${col}" stroke="#a8541a" stroke-width="1.6"/>`;
}
document.getElementById('petals').innerHTML=pet;

/* ---- scene 4: the mandap, drawn with stroke-dashoffset ---- */
const ARCH="M 206,1556 L 206,712 C 206,432 356,318 540,318 C 724,318 874,432 874,712 L 874,1556";
let strings='';
{
  const probe=document.createElementNS('http://www.w3.org/2000/svg','path');
  probe.setAttribute('d',ARCH);
  const PL=probe.getTotalLength(), pts=[];
  for(let k=0;k<=600;k++){ const pt=probe.getPointAtLength(PL*k/600); if(pt.y<706) pts.push(pt); }
  const lo=Math.round(pts.length*0.12), hi=Math.round(pts.length*0.88);
  for(let i=0;i<9;i++){
    const pt=pts[lo+Math.round(i*(hi-lo)/8)], ax=+pt.x.toFixed(1), ay=+pt.y.toFixed(1);
    const len=96+((i*37)%5)*28;
    let beads='';
    for(let b=0;b<Math.round(len/19);b++)
      beads+=`<circle cx="${ax}" cy="${(ay+24+b*19).toFixed(1)}" r="9.5" fill="${b%2?'#efa236':'#e0761f'}" stroke="#a8541a" stroke-width="1.4"/>`;
    kf('str'+i,(()=>{const st=[];const per=3.4+((i%3)*0.5);
      for(let t=0;t<=15.3;t+=per/4){const tt=Math.min(t,15);
        st.push([tt,'transform:rotate('+(Math.sin(2*Math.PI*((t+i*0.4)/per))*4.5).toFixed(2)+'deg)','ease-in-out']);
        if(tt>=15)break;} return st;})());
    strings+=`<g class="an an-str${i}" style="transform-box:view-box;transform-origin:${ax}px ${ay}px">${beads}</g>`;
  }
}
document.getElementById('scene4bg').innerHTML=`
  <g class="an an-archwrap" id="archwrap">
    <path id="archpath" class="an an-arch" d="${ARCH}" fill="none" stroke="#d79a2e" stroke-width="13" stroke-linecap="round"/>
    <path class="an an-arch2" d="${ARCH}" fill="none" stroke="#b97d1c" stroke-width="3" opacity=".5"/>
    <g class="an an-strwrap">${strings}</g>
  </g>`;
const L=Math.ceil(document.getElementById('archpath').getTotalLength());
document.querySelectorAll('#archwrap path').forEach(p=>{ p.style.strokeDasharray=L; p.style.strokeDashoffset=L; });
kf('arch',[[0,'stroke-dashoffset:'+L+'px','linear'],[9.05,'stroke-dashoffset:'+L+'px','cubic-bezier(.3,.05,.2,1)'],
           [11.3,'stroke-dashoffset:0px','linear'],[15,'stroke-dashoffset:0px']]);
kf('arch2',[[0,'stroke-dashoffset:'+L+'px','linear'],[9.3,'stroke-dashoffset:'+L+'px','cubic-bezier(.3,.05,.2,1)'],
            [11.6,'stroke-dashoffset:0px','linear'],[15,'stroke-dashoffset:0px']]);
kf('archwrap',[[0,'opacity:0','linear'],[8.7,'opacity:0','ease-in-out'],[9.3,'opacity:1','linear'],[15,'opacity:1']]);
kf('strwrap',[[0,'opacity:0','linear'],[11.1,'opacity:0','ease-in-out'],[12.2,'opacity:1','linear'],[15,'opacity:1']]);

/* ---- titles rise from below and stay ---- */
function riseKF(name,t0){
  return kf(name,[
    [0,'opacity:0;transform:translateY(78px)','linear'],
    [t0,'opacity:0;transform:translateY(78px)','cubic-bezier(.22,.7,.25,1)'],
    [t0+0.95,'opacity:1;transform:translateY(0px)','linear'],
    [15,'opacity:1;transform:translateY(0px)']
  ]);
}
riseKF('t-names',9.25); riseKF('t-date',11.35); riseKF('t-std',13.05);

/* ---- gold light curtains at 5 / 10 / 15 ---- */
(function(){
  const s=[[0,'opacity:0;transform:translateY(-2700px)','linear']];
  [T1,T2].forEach(t=>{
    s.push([t-0.62,'opacity:0;transform:translateY(-2700px)','cubic-bezier(.4,0,.25,1)']);
    s.push([t-0.30,'opacity:.95;transform:translateY(-1500px)','linear']);
    s.push([t,     'opacity:.95;transform:translateY(-640px)','linear']);
    s.push([t+0.34,'opacity:.95;transform:translateY(300px)','cubic-bezier(.4,0,.25,1)']);
    s.push([t+0.66,'opacity:0;transform:translateY(1500px)','linear']);
    s.push([t+0.67,'opacity:0;transform:translateY(-2700px)','linear']);
  });
  s.push([15,'opacity:0;transform:translateY(-2700px)','linear']);
  kf('wipe',s);
})();

/* ---- soft bokeh ---- */
let bk='';
for(let i=0;i<16;i++){
  const x=40+rnd()*1000, y=140+rnd()*820, r=16+rnd()*42, o=(0.05+rnd()*0.08).toFixed(3);
  const per=6+rnd()*5, amp=14+rnd()*26;
  kf('bk'+i,(()=>{const s=[];for(let t=0;t<=15.3;t+=per/4){const tt=Math.min(t,15);
    s.push([tt,'transform:translateY('+(Math.sin(2*Math.PI*((t+i)/per))*amp).toFixed(1)+'px)','ease-in-out']);
    if(tt>=15)break;}return s;})());
  bk+=`<circle class="an an-bk${i}" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(0)}" fill="#e8bb84" opacity="${o}"/>`;
}
document.getElementById('bokeh').innerHTML=bk;

/* ===================== wire names ===================== */
const MAP={
  'an-glint':'glint','an-arch':'arch','an-arch2':'arch2',
  'an-archwrap':'archwrap','an-strwrap':'strwrap',
  'an-t-names':'t-names','an-t-date':'t-date','an-t-std':'t-std'};
for(let i=0;i<78;i++) MAP['an-cf'+i]='cf'+i;
for(let i=0;i<46;i++) MAP['an-pt'+i]='pt'+i;
for(let i=0;i<9;i++)  MAP['an-str'+i]='str'+i;
for(let i=0;i<16;i++) MAP['an-bk'+i]='bk'+i;
Object.keys(MAP).forEach(c=>{ CSS+='.'+c+'{animation-name:'+MAP[c]+'}'; });
CSS+='#wipe{animation-name:wipe}';
document.getElementById('t-names').classList.add('an-t-names');
document.getElementById('t-date').classList.add('an-t-date');
document.getElementById('t-std').classList.add('an-t-std');
const st=document.createElement('style'); st.textContent=CSS; document.head.appendChild(st);

/* ===================== paper grain ===================== */
const GT=14,GS=200,gurl=[];
for(let i=0;i<GT;i++){
  const c=document.createElement('canvas'); c.width=c.height=GS;
  const x=c.getContext('2d'), im=x.createImageData(GS,GS), r=mulberry32(99173+i*7919);
  for(let p=0;p<im.data.length;p+=4){ const v=150+(r()-0.5)*110;
    im.data[p]=im.data[p+1]=im.data[p+2]=v; im.data[p+3]=255; }
  x.putImageData(im,0,0); gurl.push(c.toDataURL('image/png'));
}
const grainEl=document.getElementById('grain');

/* ===================== frame driver ===================== */
function setFrame(f){
  f=Math.max(0,Math.min(TOTAL-1,f));
  document.documentElement.style.setProperty('--t', (-f/FPS)+'s');
  const g=mulberry32(f*40503+17);
  grainEl.style.backgroundImage='url('+gurl[f%GT]+')';
  grainEl.style.backgroundPosition=((g()*GS)|0)+'px '+((g()*GS)|0)+'px';
  document.documentElement.dataset.frame=String(f);
}
window.setFrame=setFrame; window.TOTAL_FRAMES=TOTAL;
/* only ready once every illustration has decoded */
Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>{
  setFrame(0); window.__ready=true;
});
</script>
</body>
</html>
