<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prem &amp; Vasudha — Save The Date</title>
<style>
  /* ==========================================================
     1080x1920 · 22s · 30fps · 660 frames
     DETERMINISM: every animation is a CSS @keyframes spanning the
     full 22s, declared `paused`, with animation-delay: var(--t).
     setFrame(n) sets --t to -(n/30)s, which scrubs every animation
     on the page to exactly that instant. No clock, no rAF timing.
     ========================================================== */
  :root{ --t: 0s; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1080px; height:1920px; background:#120a14; overflow:hidden; }
  body{
    font-family:'Inter Display','Inter',system-ui,ui-sans-serif,'DejaVu Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{ position:absolute; inset:0; width:1080px; height:1920px; }
  svg{ display:block; }

  /* every animated element wears .an and gets its name from .an-<x> */
  .an{
    animation-duration:22s;
    animation-fill-mode:both;
    animation-play-state:paused;
    animation-delay:var(--t);
    animation-timing-function:linear;
    animation-iteration-count:1;
  }

  /* ---- rig: joints. transform-box:view-box resolves against each
          character's OWN nested <svg> viewBox, so these are local
          joint coordinates and every limb rotates from its joint. ---- */
  .char       { overflow:visible; }
  .shell      { transform-box:view-box; transform-origin:0px 0px; }
  .body       { transform-box:view-box; transform-origin:0px 0px; }
  .torso      { transform-box:view-box; transform-origin:0px -110px; }
  .head       { transform-box:view-box; transform-origin:0px -200px; }
  .leg-l      { transform-box:view-box; transform-origin:-18px -110px; }
  .leg-r      { transform-box:view-box; transform-origin:18px -110px; }
  .shin-l     { transform-box:view-box; transform-origin:-18px -56px; }
  .shin-r     { transform-box:view-box; transform-origin:18px -56px; }
  .arm-l      { transform-box:view-box; transform-origin:-36px -186px; }
  .arm-r      { transform-box:view-box; transform-origin:36px -186px; }
  .fore-l     { transform-box:view-box; transform-origin:-36px -142px; }
  .fore-r     { transform-box:view-box; transform-origin:36px -142px; }
  .eyes       { transform-box:view-box; transform-origin:0px -273px; }
  .brows      { transform-box:view-box; transform-origin:0px -292px; }
  .plait      { transform-box:view-box; transform-origin:46px -286px; }
  .dupatta    { transform-box:view-box; transform-origin:-36px -196px; }
  .skirt      { transform-box:view-box; transform-origin:0px -138px; }

  /* position groups live in the ROOT viewBox, so their origins are
     stage coordinates — the character's ground point, so scaling
     keeps the feet planted. */
  .pos{ transform-box:view-box; transform-origin:540px 1480px; }

  /* ---- scene 4 text ---- */
  #copy{ position:absolute; inset:0; }
  .tx{
    position:absolute; left:12%; width:76%;      /* 12% safe margin */
    text-align:center; color:#fdf4e3; white-space:nowrap;
    transform-box:border-box; transform-origin:50% 50%;
  }
  #t-names{ top:742px;  font-size:84px; font-weight:800; letter-spacing:.055em; padding-left:.055em; }
  #t-date { top:884px;  font-size:62px; font-weight:700; letter-spacing:.13em;  padding-left:.13em; color:#f5d98a; }
  #t-std  { top:1002px; font-size:34px; font-weight:500; letter-spacing:.56em;  padding-left:.56em; color:#e9dcc4; }

  /* ---- film grain + vignette over everything ---- */
  #grain{
    position:absolute; inset:-60px; z-index:60; pointer-events:none;
    background-repeat:repeat; mix-blend-mode:overlay; opacity:.07;
  }
  #vig{
    position:absolute; inset:0; z-index:61; pointer-events:none;
    background:radial-gradient(118% 76% at 50% 48%, rgba(0,0,0,0) 40%, rgba(0,0,0,.30) 74%, rgba(0,0,0,.60) 100%);
  }
</style>
</head>

    <!-- backdrop -->

    <g id="scene4bg"></g>   <!-- mandap arch, drawn behind everyone -->
    <g id="sc2bg"></g>      <!-- four family characters -->
    <g id="petals"></g>

  </svg>
  <div id="copy">
    <div class="tx an" id="t-names">PREM &amp; VASUDHA</div>
    <div class="tx an" id="t-date">24 . 01 . 2027</div>
    <div class="tx an" id="t-std">SAVE THE DATE</div>
  </div>
  <div id="grain"></div>
  <div id="vig"></div>

<script>
/* ===================== timeline core ===================== */
const FPS=30, DUR=22, TOTAL=FPS*DUR;           // 660 frames
const EASE='cubic-bezier(.45,.05,.2,1)';       // the house ease: soft in, soft out
const SWING='cubic-bezier(.34,.1,.3,1)';
let CSS='';

/* kf(name, [[tSec, props, easeForSegmentStartingHere], ...])
   props: a bare transform string, or "prop:val;prop:val" */
function kf(name, steps){
  let out='@keyframes '+name+'{';
  steps.forEach(s=>{
    const t=Math.max(0,Math.min(DUR,s[0]));
    const pct=(t/DUR*100).toFixed(4);
    let p=s[1];
    if(p.indexOf(':')===-1) p='transform:'+p;
    out+=pct+'%{'+p+';animation-timing-function:'+(s[2]||EASE)+'}';
  });
  CSS+=out+'}';
  return name;
}
/* a looping sine, sampled every quarter period and eased between
   extremes — reads as a continuous breath, stays deterministic */
function swayKF(name, period, phase, fn){
  const steps=[], q=period/4;
  for(let t=0;t<=DUR+q;t+=q){
    const tt=Math.min(t,DUR);
    steps.push([tt, fn(Math.sin(2*Math.PI*((t+phase)/period))), 'ease-in-out']);
    if(tt>=DUR) break;
  }
  return kf(name,steps);
}
/* opacity window with soft edges */
function fadeKF(name, windows){
  const s=[[0,'opacity:0','linear']];
  windows.forEach(w=>{ s.push([w[0],'opacity:0','ease-in-out'],[w[1],'opacity:1','linear'],
                              [w[2],'opacity:1','ease-in-out'],[w[3],'opacity:0','linear']); });
  return kf(name,s);
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ===================== character factory =====================
   Built from rounded, tapered shapes rather than capsules, with the
   head at roughly a third of total height so the silhouette reads as
   cute rather than as a wooden toy.                                   */
function face(id,o){
  return `
    <ellipse cx="-39" cy="-250" rx="14" ry="8.5" fill="${o.blush}" opacity=".5"/>
    <ellipse cx="39"  cy="-250" rx="14" ry="8.5" fill="${o.blush}" opacity=".5"/>
    <g class="brows an an-${id}-brows">
      <path d="M -32,-291 Q -22,-299 -12,-292" stroke="${o.hair}" stroke-width="4.4" fill="none" stroke-linecap="round"/>
      <path d="M 12,-292  Q 22,-299 32,-291"  stroke="${o.hair}" stroke-width="4.4" fill="none" stroke-linecap="round"/>
    </g>
    <g class="eyes an an-${id}-eyes">
      <ellipse cx="-22" cy="-273" rx="7.6" ry="9" fill="#2c1a1e"/>
      <ellipse cx="22"  cy="-273" rx="7.6" ry="9" fill="#2c1a1e"/>
    </g>
    <path d="M -15,-249 Q 0,-235 15,-249" stroke="#2c1a1e" stroke-width="4.4" fill="none" stroke-linecap="round"/>`;
}
/* one arm: tapered upper + forearm + mitten hand, props ride in the hand */
function arm(id,side,o){
  const sx = side==='l' ? -36 : 36;
  return `<g class="arm arm-${side} an an-${id}-arm${side}">
    <path d="M ${sx-12.5},-200 Q ${sx},-207 ${sx+12.5},-200 L ${sx+10.5},-138 Q ${sx},-132 ${sx-10.5},-138 Z"
          fill="${o.sleeve}" stroke="${o.sleeveDk}" stroke-width="1.8" stroke-linejoin="round"/>
    <g class="fore fore-${side} an an-${id}-fore${side}">
      <path d="M ${sx-10.5},-148 Q ${sx},-153 ${sx+10.5},-148 L ${sx+9.5},-100 Q ${sx},-94 ${sx-9.5},-100 Z"
            fill="${o.sleeve}" stroke="${o.sleeveDk}" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M ${sx-10.5},-103 Q ${sx},-98 ${sx+10.5},-103" stroke="${o.trim}" stroke-width="4.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="${sx}" cy="-89" rx="12.5" ry="13.5" fill="${o.skin}" stroke="${o.skinSh}" stroke-width="1.6"/>
      ${o['prop'+side]||''}
    </g></g>`;
}
/* one leg: thigh + shin + a curled-toe mojari */
function leg(id,side,o){
  const hx = side==='l' ? -18 : 18, d = side==='l' ? -1 : 1;
  return `<g class="leg leg-${side} an an-${id}-leg${side}">
    <path d="M ${hx-15},-115 Q ${hx},-120 ${hx+15},-115 L ${hx+13},-52 Q ${hx},-47 ${hx-13},-52 Z"
          fill="${o.trouser}"/>
    <g class="shin shin-${side} an an-${id}-shin${side}">
      <path d="M ${hx-13},-62 Q ${hx},-67 ${hx+13},-62 L ${hx+11},-9 Q ${hx},-4 ${hx-11},-9 Z"
            fill="${o.trouser}"/>
      <path d="M ${hx-13},-12 Q ${hx},-7 ${hx+13},-12" stroke="${o.trim}" stroke-width="3.4" fill="none" opacity=".7"/>
      <path d="M ${hx-11*d},-2 Q ${hx-12*d},-15 ${hx-1*d},-15 L ${hx+6*d},-16 Q ${hx+19*d},-14 ${hx+20*d},-2
               Q ${hx+18*d},3 ${hx+7*d},3 L ${hx-5*d},3 Q ${hx-11*d},3 ${hx-11*d},-2 Z" fill="${o.shoe}"/>
      <path d="M ${hx+17*d},-7 Q ${hx+25*d},-12 ${hx+21*d},-2" fill="none" stroke="${o.shoeDk}" stroke-width="3.2" stroke-linecap="round"/>
    </g></g>`;
}
function makeChar(id,o){
  /* ---- Prem: cream sherwani, maroon safa with a kalgi ---- */
  const sherwani = `
    <path d="M -37,-193 Q -32,-205 0,-207 Q 32,-205 37,-193 L 51,-80 Q 0,-69 -51,-80 Z" fill="${o.garment}"/>
    <path d="M 0,-196 L 0,-74" stroke="${o.trim}" stroke-width="3.4" opacity=".9"/>
    <circle cx="0" cy="-172" r="3.6" fill="${o.trim}"/><circle cx="0" cy="-148" r="3.6" fill="${o.trim}"/>
    <circle cx="0" cy="-124" r="3.6" fill="${o.trim}"/><circle cx="0" cy="-100" r="3.6" fill="${o.trim}"/>
    <path d="M -51,-80 Q 0,-69 51,-80 L 50,-94 Q 0,-83 -50,-94 Z" fill="${o.trim}" opacity=".95"/>`;
  const safa = `
    <path d="M -64,-284 C -68,-330 -42,-354 0,-354 C 42,-354 68,-330 64,-284
             C 36,-300 -36,-300 -64,-284 Z" fill="${o.hat}"/>
    <path d="M -64,-288 C -40,-304 40,-304 64,-288 L 63,-276 C 38,-293 -38,-293 -63,-276 Z" fill="${o.hatDk}"/>
    <path d="M -58,-312 C -34,-325 34,-325 58,-312" stroke="${o.hatDk}" stroke-width="6.5" fill="none" opacity=".5"/>
    <path d="M -47,-335 C -27,-345 27,-345 47,-335" stroke="${o.hatDk}" stroke-width="5.5" fill="none" opacity=".4"/>
    <path d="M 57,-294 C 70,-287 74,-273 69,-259 C 68,-271 61,-282 51,-288 Z" fill="${o.hatDk}"/>
    <path d="M -24,-346 C -31,-364 -27,-380 -17,-389 C -21,-373 -21,-360 -18,-349 Z" fill="${o.trim}"/>
    <path d="M -24,-346 C -34,-360 -34,-372 -28,-381 C -29,-368 -27,-357 -21,-348 Z" fill="${o.trim}" opacity=".75"/>
    <circle cx="-23" cy="-337" r="9.5" fill="${o.trim}"/>
    <circle cx="-23" cy="-337" r="4" fill="#8c1f2e"/>`;

  /* ---- Vasudha: red-and-gold lehenga, dupatta, long plait ---- */
  const choli = `
    <path d="M -35,-193 Q -30,-205 0,-207 Q 30,-205 35,-193 L 41,-150 Q 0,-142 -41,-150 Z" fill="${o.garment}"/>
    <path d="M -41,-152 Q 0,-145 41,-152" stroke="${o.trim}" stroke-width="4.2" fill="none" stroke-linecap="round"/>
    <path d="M -34,-153 Q 0,-146 34,-153 L 33,-131 Q 0,-124 -33,-131 Z" fill="${o.skin}"/>`;
  const lehenga = `
    <g class="skirt an an-${id}-skirt">
      <path d="M -35,-136 Q 0,-143 35,-136 L 88,-6 Q 0,11 -88,-6 Z" fill="${o.garment}"/>
      <path d="M -35,-136 Q 0,-143 35,-136 L 47,-106 Q 0,-97 -47,-106 Z" fill="${o.garmentDk}" opacity=".35"/>
      <path d="M -62,-66 Q 0,-55 62,-66" stroke="${o.trim}" stroke-width="3.4" fill="none" opacity=".8"/>
      <path d="M -88,-6 Q 0,11 88,-6 L 85,-23 Q 0,-6 -85,-23 Z" fill="${o.trim}"/>
      <circle cx="-38" cy="-40" r="3.6" fill="${o.trim}" opacity=".9"/>
      <circle cx="0"   cy="-33" r="3.6" fill="${o.trim}" opacity=".9"/>
      <circle cx="38"  cy="-40" r="3.6" fill="${o.trim}" opacity=".9"/>
      <circle cx="-20" cy="-84" r="3.2" fill="${o.trim}" opacity=".8"/>
      <circle cx="20"  cy="-84" r="3.2" fill="${o.trim}" opacity=".8"/>
    </g>`;
  const hairBack = `
    <path d="M -72,-258 C -78,-322 -44,-356 0,-356 C 44,-356 78,-322 72,-258
             C 72,-224 64,-206 56,-196 L -56,-196 C -64,-206 -72,-224 -72,-258 Z" fill="${o.hair}"/>`;
  const hairFront = `
    <path d="M -65,-264 C -70,-324 -41,-353 0,-353 C 41,-353 70,-324 65,-264
             C 58,-292 40,-307 0,-307 C -40,-307 -58,-292 -65,-264 Z" fill="${o.hair}"/>
    <path d="M 0,-353 L 0,-309" stroke="${o.hairDk}" stroke-width="3.2" opacity=".85"/>
    <path d="M 0,-306 L 0,-294" stroke="${o.trim}" stroke-width="3.2"/>
    <circle cx="0" cy="-289" r="6.4" fill="${o.trim}"/>
    <circle cx="0" cy="-289" r="2.6" fill="#8c1f2e"/>
    <circle cx="-57" cy="-242" r="6" fill="${o.trim}"/>
    <circle cx="57"  cy="-242" r="6" fill="${o.trim}"/>`;
  const plait = `
    <g class="plait an an-${id}-plait">
      <path d="M 50,-290 C 78,-258 80,-206 70,-166 C 65,-144 60,-130 56,-120"
            stroke="${o.hair}" stroke-width="27" fill="none" stroke-linecap="round"/>
      <path d="M 70,-252 q 11,5 0,11 M 73,-224 q 11,5 0,11 M 71,-196 q 10,5 0,11
               M 66,-168 q 10,5 0,11 M 61,-141 q 9,4 0,10"
            stroke="${o.hairDk}" stroke-width="3.2" fill="none" stroke-linecap="round" opacity=".85"/>
      <path d="M 56,-122 l -7,16 l 14,0 Z" fill="${o.trim}"/><circle cx="56" cy="-104" r="4" fill="${o.trim}"/>
    </g>`;
  const dupatta = `
    <g class="dupatta an an-${id}-dupatta">
      <path d="M -32,-200 Q -62,-174 -70,-118 Q -78,-56 -64,-2 L -42,-4 Q -54,-56 -48,-114 Q -43,-156 -20,-186 Z"
            fill="${o.veil}" opacity=".40"/>
      <path d="M -32,-200 Q -62,-174 -70,-118 Q -78,-56 -64,-2" stroke="${o.trim}" stroke-width="2.6" fill="none" opacity=".45"/>
    </g>`;
  const simpleHat = o.hatSimple||'';
  const simpleTop = `
    <path d="M -35,-193 Q -30,-205 0,-207 Q 30,-205 35,-193 L 47,-84 Q 0,-74 -47,-84 Z" fill="${o.garment}"/>
    <path d="M 0,-196 L 0,-78" stroke="${o.trim}" stroke-width="2.6" opacity=".5"/>
    <path d="M -47,-84 Q 0,-74 47,-84 L 46,-95 Q 0,-85 -46,-95 Z" fill="${o.trim}" opacity=".6"/>`;

  const torsoInner = o.kind==='lehenga' ? choli : (o.kind==='sherwani' ? sherwani : simpleTop);
  const headwear   = o.kind==='lehenga' ? hairFront : (o.kind==='sherwani' ? safa : simpleHat);

  return `<svg id="${id}" class="char" overflow="visible"
            x="${o.cx-o.w/2}" y="${o.baseY-0.9375*(o.w*384/260)}"
            width="${o.w}" height="${o.w*384/260}" viewBox="-130 -360 260 384">
    <g class="shell an an-${id}-shell">
    <ellipse cx="0" cy="4" rx="62" ry="13" fill="#2a0f14" opacity=".32"/>
    <g class="body an an-${id}-body">
      ${o.kind==='lehenga' ? dupatta : ''}
      ${leg(id,'l',o)}
      ${leg(id,'r',o)}
      <g class="torso an an-${id}-torso">
        ${o.kind==='lehenga' ? lehenga : ''}
        ${torsoInner}
      </g>
      <g class="head an an-${id}-head">
        ${o.kind==='lehenga' ? hairBack : ''}
        <circle cx="0" cy="-268" r="62" fill="${o.skin}"/>
        <circle cx="-60" cy="-258" r="8.5" fill="${o.skinSh}" opacity=".9"/>
        <circle cx="60"  cy="-258" r="8.5" fill="${o.skinSh}" opacity=".9"/>
        ${face(id,o)}
        ${headwear}
        ${o.kind==='lehenga' ? plait : ''}
      </g>
      ${arm(id,'l',o)}
      ${arm(id,'r',o)}
      <circle cx="-36" cy="-187" r="13" fill="${o.sleeve}"/>
      <circle cx="36"  cy="-187" r="13" fill="${o.sleeve}"/>
      ${o.kind==='sherwani' ? `<path d="M -37,-193 Q -32,-205 0,-207 Q 32,-205 37,-193 L 36,-180 Q 0,-192 -36,-180 Z" fill="${o.garment}"/>` : ''}
      ${o.kind==='lehenga'  ? `<path d="M -35,-193 Q -30,-205 0,-207 Q 30,-205 35,-193 L 34,-176 Q 20,-184 16,-190 Q 0,-178 -16,-190 Q -20,-184 -34,-176 Z" fill="${o.garment}"/>` : ''}
      ${o.kind==='simple'   ? `<path d="M -35,-193 Q -30,-205 0,-207 Q 30,-205 35,-193 L 34,-180 Q 0,-192 -34,-180 Z" fill="${o.garment}"/>` : ''}
      <path d="M -15,-207 Q 0,-201 15,-207 L 14,-189 Q 0,-182 -14,-189 Z" fill="${o.skinSh}"/>
      ${o.kind==='sherwani' ? `<path d="M -19,-199 Q 0,-191 19,-199 L 18,-184 Q 0,-177 -18,-184 Z" fill="${o.garmentDk}"/><path d="M -19,-199 Q 0,-191 19,-199" stroke="${o.trim}" stroke-width="2.6" fill="none" opacity=".8"/>` : ''}
    </g></g></svg>`;
}

/* ===================== cast ===================== */
const PHONE=(sx,rot)=>`<g class="an an-phone" style="transform-box:view-box;transform-origin:${sx}px -90px">
     <rect x="${sx-17}" y="-118" width="34" height="54" rx="7" fill="#2b2733" transform="rotate(${rot} ${sx} -90)"/>
     <rect x="${sx-12.5}" y="-113" width="25" height="43" rx="3.5" fill="#cfe4e8" transform="rotate(${rot} ${sx} -90)"/>
   </g>`;
const RING=`<g class="an an-ringhold" style="transform-box:view-box;transform-origin:40px -90px">
     <g class="an an-glint" style="transform-box:view-box;transform-origin:40px -100px">
       <path d="M 40,-150 L 46,-110 L 86,-104 L 46,-98 L 40,-58 L 34,-98 L -6,-104 L 34,-110 Z" fill="url(#sparkle)"/></g>
     <circle cx="40" cy="-102" r="10" fill="none" stroke="#f0c75a" stroke-width="4.5"/>
     <circle cx="40" cy="-115" r="6" fill="#fff6dd"/></g>`;
const PREM={ kind:'sherwani', skin:'#eab889', skinSh:'#c9915f', blush:'#e9897b', hair:'#2e1a16', hairDk:'#1d100d',

<script>

  [14.7, 'translate(-186px,0px) scale(1)'],
  [15.3, 'translate(-80px,132px) scale(.72)'],      // final two-shot, lower in frame
  [22,   'translate(-80px,132px) scale(.72)']
]);
kf('pos-vasu',[

]);

/* ---------- PREM ---------- */
/* body: stands, then kneels (whole body drops as the knee folds), then sways */
kf('pm-body',[
  [0,   'translate(0px,0px)','ease-in-out'],
  [10.5,'translate(0px,0px)'],
  [10.8,'translate(0px,-7px)'],                      /* anticipation: he rises before he drops */
  [12.0,'translate(0px,52px)'],

/* a real knee fold: hip swings back, shin folds under, front leg takes the weight */
kf('pm-legl',[[0,'rotate(0deg)'],[10.5,'rotate(0deg)'],[10.8,'rotate(0deg)'],[12.0,'rotate(2deg)'],[15.0,'rotate(2deg)'],[15.9,'rotate(0deg)'],[22,'rotate(0deg)']]);

]);

  [5.0, 'rotate(-4deg)'],
  [6.6, 'rotate(-4deg)'],

]);

  [16.1,'rotate(-7deg)'],                            /* becomes the held hand */
  [22,  'rotate(-7deg)']]);
kf('pm-forer',[
  [0,   'rotate(96deg)'],
  [3.02,'rotate(96deg)','cubic-bezier(.3,0,.2,1)'],
  [3.18,'rotate(101deg)'],
  [3.85,'rotate(78deg)'],
  [5.0, 'rotate(28deg)'],

  [15.0,'rotate(-57deg)'],
  [16.1,'rotate(2deg)'],

/* left arm: relaxed, celebrates a touch in scene 2, steadies the knee in 3 */
kf('pm-arml',[

/* eyebrows lift on the buzz and stay a little raised — surprise */
kf('pm-brows',[

]);

/* ---------- VASUDHA ---------- */
/* sits for scene 1 (body drops and settles), stands from 5s on */
kf('vs-body',[
  [0,   'translate(0px,76px)'],                      /* seated on the floor */

  [5.4, 'translate(0px,-6px)'],

kf('vs-legl',[[0,'rotate(-70deg)'],[4.7,'rotate(-70deg)'],[5.5,'rotate(0deg)'],[22,'rotate(0deg)']]);

kf('vs-shinr',[[0,'rotate(70deg)'],[4.7,'rotate(70deg)'],[5.5,'rotate(0deg)'],[22,'rotate(0deg)']]);
kf('vs-torso',[
  [0,'rotate(-6deg)'],[4.7,'rotate(-6deg)'],[5.3,'rotate(0deg)'],
  [12.2,'rotate(0deg)'],[13.0,'rotate(-4deg)'],[15.9,'rotate(0deg)'],[22,'rotate(0deg)']
]);
kf('vs-head',[
  [0,   'rotate(-10deg)'],                              /* reading her phone */
  [2.6, 'rotate(-8deg)'],
  [3.4, 'rotate(-2deg)'],
  [5.0, 'rotate(-4deg)'],
  [6.6, 'rotate(-4deg)'],
  [7.4, 'rotate(-9deg)'],                               /* turns to the centre */
  [10.4,'rotate(-9deg)'],
  [12.2,'rotate(-5deg)'],

  [16.1,'rotate(0deg)'],

]);
/* her left arm holds the phone up in scene 1; both hands fly to her face in scene 3 */
kf('vs-arml',[

kf('vs-forel',[

kf('vs-armr',[

  [13.2,'rotate(-132deg)'],

  [22,  'rotate(-11deg)']]);
kf('vs-forer',[
  [0,'rotate(6deg)'],[5.8,'rotate(6deg)'],[12.2,'rotate(6deg)'],[12.45,'rotate(-2deg)'],

kf('vs-brows',[[0,'translateY(0px)'],[12.4,'translateY(0px)'],[13.0,'translateY(-6px)'],

/* idle life: sway, plait, dupatta, blinks */

swayKF('sway-b',4.4,2.2,v=>'rotate('+(v*1.5).toFixed(2)+'deg)');

/* blinks: eyes squash shut for ~0.1s at a few moments, never in sync */
function blinkKF(name,times){
  const s=[[0,'transform:scaleY(1)','linear']];
  times.forEach(t=>{ s.push([t-0.09,'transform:scaleY(1)','ease-in'],[t,'transform:scaleY(.08)','ease-out'],
                            [t+0.1,'transform:scaleY(1)','linear']); });
  return kf(name,s);
}
blinkKF('blink-p',[1.4,4.3,6.9,9.6,13.4,17.2,20.1]);
kf('none-a',[[0,'opacity:1','linear'],[22,'opacity:1','linear']]);

  [2.98,'transform:rotate(0deg) translate(0px,0px)','linear']];
  for(let k=0;k<=14;k++){const t=3.0+k*0.032, a=(k%2?1:-1)*(3.4*(1-k/15));
    s.push([t,'transform:rotate('+a.toFixed(2)+'deg) translate('+(a*0.5).toFixed(2)+'px,0px)','linear']);}
  s.push([3.52,'transform:rotate(0deg) translate(0px,0px)','linear'],[22,'transform:rotate(0deg) translate(0px,0px)','linear']);
  return s;})());

FAM.forEach((f,i)=>{

    [22,'opacity:0;transform:translateY(0px)']
  ]);
  /* every one of them turns their head to the centre, staggered and eased */
  const turn = f.cx<540 ? 21 : -21;
  kf(f.id+'-head',[

    [10,'rotate('+turn+'deg)'],[22,'rotate('+turn+'deg)']
  ]);
});

kf('f2-arml',[[0,'rotate(-6deg)'],[7.7,'rotate(-6deg)'],[8.5,'rotate(-150deg)'],

              [9.0,'rotate(142deg)'],[9.9,'rotate(150deg)'],[22,'rotate(150deg)']]);
kf('f2-forel',[[0,'rotate(0deg)'],[7.7,'rotate(0deg)'],[8.5,'rotate(26deg)'],[22,'rotate(26deg)']]);
kf('f2-forer',[[0,'rotate(0deg)'],[7.7,'rotate(0deg)'],[8.5,'rotate(-26deg)'],[22,'rotate(-26deg)']]);
/* and a little bounce of joy under him */
kf('f2-bodyhop',[[0,'translateY(0px)'],[8.5,'translateY(0px)'],[8.8,'translateY(-16px)','ease-out'],
                 [9.15,'translateY(0px)','ease-in'],[9.3,'translateY(-7px)','ease-out'],

  steps.push([Math.min(21.9,t0+dur+0.05),'opacity:0','linear'],[22,'opacity:0','linear']);
  kf(nm,steps);
  conf+=`<rect class="an an-${nm}" x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="2" fill="${col}"/>`;
}
document.getElementById('confetti').innerHTML=conf;

/* ---- scene 3: a ring of marigold petals expanding outward ---- */
let pet='';
for(let i=0;i<44;i++){
  const a=(i/44)*Math.PI*2+rnd()*0.12, R=300+rnd()*170;
  const t0=12.5+ (i%6)*0.05 + rnd()*0.14, dur=1.9+rnd()*0.7;
  const col=['#f2a93b','#e8862c','#f6c45c','#dd6f2a'][(rnd()*4)|0];
  const rot=(rnd()*360)|0, sp=(rnd()*300-150)|0;
  kf('pt'+i,[
    [0,'opacity:0;transform:translate(540px,1255px) rotate('+rot+'deg) scale(0)','linear'],
    [t0,'opacity:0;transform:translate(540px,1255px) rotate('+rot+'deg) scale(0)','cubic-bezier(.16,.8,.3,1)'],
    [t0+0.3,'opacity:1;transform:translate('+(540+Math.cos(a)*R*0.35).toFixed(0)+'px,'+(1255+Math.sin(a)*R*0.35).toFixed(0)+'px) rotate('+(rot+sp*0.35)+'deg) scale(1.1)','cubic-bezier(.16,.8,.3,1)'],
    [t0+dur,'opacity:0;transform:translate('+(540+Math.cos(a)*R).toFixed(0)+'px,'+(1255+Math.sin(a)*R).toFixed(0)+'px) rotate('+(rot+sp)+'deg) scale(.6)','linear'],
    [22,'opacity:0','linear']
  ]);
  pet+=`<ellipse class="an an-pt${i}" cx="0" cy="0" rx="19" ry="12" fill="${col}"/>`;
}
document.getElementById('petals').innerHTML=pet;

/* ---- scene 4: the mandap, drawn with stroke-dashoffset ---- */
const ARCH="M 214,1452 L 214,742 C 214,470 360,360 540,360 C 720,360 866,470 866,742 L 866,1452";
let strings='';
{
 const probe=document.createElementNS('http://www.w3.org/2000/svg','path');
 probe.setAttribute('d',ARCH);
 const PL=probe.getTotalLength(), pts=[];
 for(let k=0;k<=600;k++){ const pt=probe.getPointAtLength(PL*k/600); if(pt.y<738) pts.push(pt); }
 const lo=Math.round(pts.length*0.12), hi=Math.round(pts.length*0.88);
 for(let i=0;i<9;i++){
  const pt=pts[lo+Math.round(i*(hi-lo)/8)], ax=+pt.x.toFixed(1), ay=+pt.y.toFixed(1);
  const len=92+((i*37)%5)*26;
  let beads='';
  for(let b=0;b<Math.round(len/19);b++) beads+=`<circle cx="${ax}" cy="${(ay+24+b*19).toFixed(1)}" r="9.5" fill="${b%2?'#f0a43a':'#e8862c'}"/>`;
  kf('str'+i, (()=>{ const st=[]; const per=3.4+((i%3)*0.5);
     for(let t=0;t<=22.3;t+=per/4){ const tt=Math.min(t,22);
       st.push([tt,'transform:rotate('+(Math.sin(2*Math.PI*((t+i*0.4)/per))*4.5).toFixed(2)+'deg)','ease-in-out']);
       if(tt>=22) break; } return st; })());
  strings+=`<g class="an an-str${i}" style="transform-box:view-box;transform-origin:${ax}px ${ay}px">${beads}</g>`;
 }
}
document.getElementById('scene4bg').innerHTML = `
  <g class="an an-archwrap" id="archwrap">
    <path id="archpath" class="an an-arch" d="${ARCH}" fill="none"
          stroke="url(#goldstroke)" stroke-width="13" stroke-linecap="round"/>
    <path d="${ARCH}" fill="none" stroke="#ffe6ae" stroke-width="3" opacity=".45"
          class="an an-arch2"/>
    <g class="an an-strwrap">${strings}</g>
  </g>`;
/* measure the real path length so the draw-on is exact */
const L=Math.ceil(document.getElementById('archpath').getTotalLength());
document.querySelectorAll('#archwrap path').forEach(p=>{
  p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
});
kf('arch',[
  [0,'stroke-dashoffset:'+L+'px','linear'],
  [15.15,'stroke-dashoffset:'+L+'px','cubic-bezier(.3,.05,.2,1)'],
  [17.45,'stroke-dashoffset:0px','linear'],
  [22,'stroke-dashoffset:0px']
]);
kf('arch2',[
  [0,'stroke-dashoffset:'+L+'px','linear'],
  [15.35,'stroke-dashoffset:'+L+'px','cubic-bezier(.3,.05,.2,1)'],
  [17.7,'stroke-dashoffset:0px','linear'],
  [22,'stroke-dashoffset:0px']
]);
kf('archwrap',[[0,'opacity:0','linear'],[14.9,'opacity:0','ease-in-out'],[15.5,'opacity:1','linear'],[22,'opacity:1']]);
kf('strwrap',[[0,'opacity:0','linear'],[17.2,'opacity:0','ease-in-out'],[18.4,'opacity:1','linear'],[22,'opacity:1']]);

/* ---- text: rises slowly from below, then stays ---- */
function riseKF(name,t0){
  return kf(name,[
    [0,'opacity:0;transform:translateY(78px)','linear'],
    [t0,'opacity:0;transform:translateY(78px)','cubic-bezier(.22,.7,.25,1)'],
    [t0+0.95,'opacity:1;transform:translateY(0px)','linear'],
    [22,'opacity:1;transform:translateY(0px)']
  ]);
}
riseKF('t-names',15.25);   /* holds 3s  */
riseKF('t-date', 18.25);   /* holds 2s  */
riseKF('t-std',  20.25);   /* holds 2s  */

/* ---- the gold light curtains at 5 / 10 / 15 ---- */
(function(){
  const s=[[0,'opacity:0;transform:translateY(-2700px)','linear']];
  [T1,T2,T3].forEach(t=>{
    s.push([t-0.62,'opacity:0;transform:translateY(-2700px)','cubic-bezier(.4,0,.25,1)']);
    s.push([t-0.30,'opacity:1;transform:translateY(-1500px)','linear']);
    s.push([t,     'opacity:1;transform:translateY(-640px)','linear']);
    s.push([t+0.34,'opacity:1;transform:translateY(300px)','cubic-bezier(.4,0,.25,1)']);
    s.push([t+0.66,'opacity:0;transform:translateY(1500px)','linear']);
    s.push([t+0.67,'opacity:0;transform:translateY(-2700px)','linear']);
  });
  s.push([22,'opacity:0;transform:translateY(-2700px)','linear']);
  kf('wipe',s);
})();

/* soft bokeh lanterns drifting behind everything */
let bk='';
for(let i=0;i<16;i++){
  const x=40+rnd()*1000, y=140+rnd()*760, r=14+rnd()*40, o=(0.05+rnd()*0.09).toFixed(3);
  const per=6+rnd()*5, amp=14+rnd()*26;
  kf('bk'+i,(()=>{const s=[];for(let t=0;t<=22.3;t+=per/4){const tt=Math.min(t,22);
    s.push([tt,'transform:translateY('+(Math.sin(2*Math.PI*((t+i)/per))*amp).toFixed(1)+'px)','ease-in-out']);
    if(tt>=22)break;}return s;})());
  bk+=`<circle class="an an-bk${i}" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(0)}" fill="#ffd9a0" opacity="${o}"/>`;
}
document.getElementById('bokeh').innerHTML=bk;

/* ===================== wire names → elements ===================== */
const MAP={
  'an-pos-prem':'pos-prem','an-pos-vasu':'pos-vasu',
  'an-pm-body':'pm-body','an-pm-torso':'pm-torso','an-pm-head':'pm-head',
  'an-pm-legl':'pm-legl','an-pm-shinl':'pm-shinl','an-pm-legr':'pm-legr','an-pm-shinr':'pm-shinr',
  'an-pm-arml':'pm-arml','an-pm-forel':'pm-forel','an-pm-armr':'pm-armr','an-pm-forer':'pm-forer',
  'an-pm-brows':'pm-brows','an-pm-eyes':'blink-p','an-pm-plait':'plait','an-pm-dupatta':'veil',
  'an-vs-body':'vs-body','an-pm-shell':'none-a','an-vs-shell':'none-a','an-vs-torso':'vs-torso','an-vs-head':'vs-head',
  'an-vs-legl':'vs-legl','an-vs-shinl':'vs-shinl','an-vs-legr':'vs-legr','an-vs-shinr':'vs-shinr',
  'an-vs-arml':'vs-arml','an-vs-forel':'vs-forel','an-vs-armr':'vs-armr','an-vs-forer':'vs-forer',
  'an-vs-brows':'vs-brows','an-vs-eyes':'blink-v','an-vs-plait':'plait','an-vs-dupatta':'veil',
  'an-seat':'seat','an-phone':'phone','an-bubble':'bubble','an-dot1':'dot1','an-dot2':'dot2','an-dot3':'dot3',
  'an-heart':'heart','an-ringhold':'ringhold','an-glint':'glint','an-wipe':'wipe',
  'an-arch':'arch','an-arch2':'arch2','an-archwrap':'archwrap','an-strwrap':'strwrap'
};
FAM.forEach(f=>{
  MAP['an-'+f.id+'-shell']=f.id+'-shell';
  MAP['an-'+f.id+'-head']=f.id+'-head';
  MAP['an-'+f.id+'-torso']='sway-a';
  MAP['an-'+f.id+'-eyes']='blink-p';
});
['arml','armr','forel','forer'].forEach(k=>{ MAP['an-f2-'+k]='f2-'+k; });
for(let i=0;i<78;i++) MAP['an-cf'+i]='cf'+i;
for(let i=0;i<44;i++) MAP['an-pt'+i]='pt'+i;
for(let i=0;i<9;i++)  MAP['an-str'+i]='str'+i;
for(let i=0;i<16;i++) MAP['an-bk'+i]='bk'+i;
MAP['an-t-names']='t-names'; MAP['an-t-date']='t-date'; MAP['an-t-std']='t-std';

/* torso sway for the leads sits on the body group of the simple cast and on
   dedicated wrappers for the leads, so it never fights a pose keyframe */
Object.keys(MAP).forEach(cls=>{ CSS+='.'+cls+'{animation-name:'+MAP[cls]+'}'; });
/* the celebrating uncle gets a hop layered on his position group */
MAP['an-f2-body']='f2-bodyhop';
/* ids used directly by the wipe + text */
document.getElementById('wipe').classList.add('an-wipe');
document.getElementById('t-names').classList.add('an-t-names');
document.getElementById('t-date').classList.add('an-t-date');
document.getElementById('t-std').classList.add('an-t-std');

const st=document.createElement('style'); st.textContent=CSS; document.head.appendChild(st);

/* ===================== film grain ===================== */
const GT=14,GS=200,gurl=[];
for(let i=0;i<GT;i++){
  const c=document.createElement('canvas'); c.width=c.height=GS;
  const x=c.getContext('2d'), im=x.createImageData(GS,GS), r=mulberry32(99173+i*7919);
  for(let p=0;p<im.data.length;p+=4){ const v=118+(r()-0.5)*140;
    im.data[p]=im.data[p+1]=im.data[p+2]=v; im.data[p+3]=255; }
  x.putImageData(im,0,0); gurl.push(c.toDataURL('image/png'));
}
const grainEl=document.getElementById('grain');

/* ===================== the frame driver ===================== */
function setFrame(f){
  f=Math.max(0,Math.min(TOTAL-1,f));
  document.documentElement.style.setProperty('--t', (-f/FPS)+'s');
  const g=mulberry32(f*40503+17);
  grainEl.style.backgroundImage='url('+gurl[f%GT]+')';
  grainEl.style.backgroundPosition=((g()*GS)|0)+'px '+((g()*GS)|0)+'px';
  document.documentElement.dataset.frame=String(f);
}
window.setFrame=setFrame; window.TOTAL_FRAMES=TOTAL; window.__ready=true;
setFrame(0);
</script>
</body>
